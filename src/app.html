<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0E7C66" />
		<!-- PWA install support. Both manifest and icon are SvelteKit
		     endpoints, served per tenant so each subdomain installs
		     with its own name + brand colour. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
		<!-- iOS "Add to Home Screen" — Apple ignores the manifest icon
		     and looks for apple-touch-icon explicitly. -->
		<link rel="apple-touch-icon" href="/pwa-icon.svg" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
