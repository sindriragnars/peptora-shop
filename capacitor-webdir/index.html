<!doctype html>
<html lang="is">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Hleð…</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				background: #faf7f2;
				color: #1a1a1a;
				font-family: system-ui, -apple-system, sans-serif;
				height: 100%;
			}
			.center {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				height: 100%;
				gap: 1rem;
			}
			.spinner {
				width: 24px;
				height: 24px;
				border: 2px solid #d9d4cc;
				border-top-color: #0e7c66;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			.label {
				font-size: 0.875rem;
				color: #6b6b6b;
			}
		</style>
	</head>
	<body>
		<div class="center">
			<div class="spinner"></div>
			<div class="label">Hleð verslun…</div>
		</div>
	</body>
</html>
